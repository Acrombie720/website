# Tells Bing, ChatGPT's search, Yandex, Naver and Seznam about pages that a
# merge to main changed, once Cloudflare Pages is actually serving them.
#
# Google does not take part in IndexNow and finds new pages through
# sitemap.xml on its own schedule.
#
# Nothing secret is involved. The IndexNow key is a public file on the site,
# which is how the protocol proves the key belongs to whoever owns the site.

name: IndexNow

on:
  push:
    branches: [main]
    paths: ['fluencyfox-site_6/**']
  # A manual run submits every URL in the sitemap.
  workflow_dispatch:

# One at a time. Two runs racing would submit the same URLs twice and could
# wait on each other's deploy.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The job compares this push against the commit before it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm install: these scripts use Node built-ins only.
      - name: Work out which pages changed
        id: changed
        run: |
          node build/changed-urls.mjs "${{ github.event.before }}" "${{ github.sha }}" \
            | sed '/^$/d' > changed-urls.txt
          echo "count=$(wc -l < changed-urls.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Changed pages:"
          cat changed-urls.txt

      - name: Wait for the deploy to go live
        if: steps.changed.outputs.count != '0'
        run: node build/wait-for-deploy.mjs 12

      - name: Tell IndexNow
        if: steps.changed.outputs.count != '0'
        run: xargs -r node build/ping-indexnow.mjs < changed-urls.txt

      - name: Nothing to submit
        if: steps.changed.outputs.count == '0'
        run: echo "No page in the sitemap changed in this push."
