<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ATS integrations: logo cycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --text:#383D3A;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:#FFFFFF;
    display:flex; align-items:center; justify-content:center;
    padding:0 20px;
    font-family:"Poppins", -apple-system, "Segoe UI", sans-serif;
    color:var(--text);
  }

  .wrap{ width:1100px; max-width:100%; }

  .marquee{
    position:relative;
    width:100%;
    background:#fff;
    overflow:hidden;
    padding:22px 0;
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 8%, #000 92%, transparent 100%);
    mask-image:linear-gradient(to right, transparent 0, #000 8%, #000 92%, transparent 100%);
  }

  .marquee-track{
    display:flex; align-items:center;
    width:max-content;
    gap:40px;
    animation:scroll 17s linear infinite;
    /* Promote to its own GPU layer up front. Without this, mobile Safari
       can fall back to software-compositing an animated element that sits
       inside both a mask and a CSS-scaled iframe, which drops frames and
       makes the scroll look sluggish instead of a steady 17s loop. */
    will-change: transform;
    -webkit-backface-visibility: hidden;
  }
  .marquee:hover .marquee-track{ animation-play-state:paused; }

  .logo-item{
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
    width:92px; height:92px;
    border-radius:50%;
    overflow:hidden;
  }
  .logo-item svg{ width:100%; height:100%; display:block; }

  @keyframes scroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }

  @media (prefers-reduced-motion: reduce){
    .marquee-track{ animation:none; }
  }
</style>
</head>
